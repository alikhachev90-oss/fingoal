name: Push reminders tick

# Backup for the every-minute Supabase job (supabase/cron.sql) and a health
# check of the live site. GitHub runs schedules loosely, so this alone is not
# enough for on-time reminders; the tick never sends anything twice.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: App shell is served
        run: curl -fsS --max-time 30 https://fingoal-tan.vercel.app/dashboard | grep -q 'id="root"'
      - name: Build version is published
        run: curl -fsS --max-time 30 https://fingoal-tan.vercel.app/version.json | tee /dev/stderr | grep -q '"id"'
      - name: Send due reminders
        run: curl -fsS --max-time 60 https://fingoal-tan.vercel.app/api/push/tick | tee /dev/stderr | grep -q '"ok":true'
