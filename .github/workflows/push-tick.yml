name: Push reminders tick

# Vercel's free plan only runs its own cron once a day, which is far too
# coarse for "remind me at 18:30". This pokes the endpoint every 5 minutes;
# the endpoint itself decides what is due and never sends anything twice.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 https://fingoal-tan.vercel.app/api/push/tick
