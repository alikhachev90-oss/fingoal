name: Push reminders tick

# Backup for the every-minute Supabase job (supabase/cron.sql) and a health
# check of the live site. GitHub runs schedules loosely, so this alone is not
# enough for on-time reminders; the tick never sends anything twice.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: App shell is served
        run: curl -fsS --max-time 30 https://fingoal-tan.vercel.app/dashboard | grep -q 'id="root"'
      - name: Build version is published
        run: curl -fsS --max-time 30 https://fingoal-tan.vercel.app/version.json | tee /dev/stderr | grep -q '"id"'
      - name: Send due reminders
        run: curl -fsS --max-time 60 https://fingoal-tan.vercel.app/api/push/tick | tee /dev/stderr | grep -q '"ok":true'
      - name: AI friend is configured
        # 401 = key is set (the call just isn't signed in); 503 = ANTHROPIC_API_KEY missing.
        # Reported, never failing the job.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' https://fingoal-tan.vercel.app/api/coach)
          echo "coach endpoint: $code"
          [ "$code" = "401" ] && echo "AI key: configured" || echo "AI key: NOT configured"
      - name: Supabase cron is running
        # Reported, never failing: when the every-minute job last called in.
        run: curl -s --max-time 30 'https://fingoal-tan.vercel.app/api/push/tick?status=1' || true
      - name: AI key is accepted
        run: curl -s --max-time 30 'https://fingoal-tan.vercel.app/api/coach?check=1' || true
